name: release

# Push a tag like "v0.2.0" to build, sign, and publish a GitHub Release with
# the updater's latest.json manifest — the in-app "Check for Updates" button
# (Components page) reads that manifest to find and verify new versions.
#
# Signing is one-time setup: a keypair was generated with
# `npx @tauri-apps/cli signer generate`, the public half is committed in
# `plugins.updater.pubkey` (src-tauri/tauri.conf.json), and the private half
# + its password live only in this repo's Actions secrets
# (TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD) — never in
# this file or the repo itself.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
          - platform: ubuntu-22.04

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Caches ~/.cargo and src-tauri/target between releases; a cold Tauri
      # release build is most of this job's ~14 minutes.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            mcp -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # Vite 8 needs Node 20.19+/22.12+, and Node 20 is end-of-life — build on
      # the same LTS line used for local development.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # No separate step builds the MCP helper: tauri.conf.json's
      # beforeBuildCommand runs scripts/build-sidecar.mjs, which compiles mcp/
      # (release) and copies it to src-tauri/binaries/mtc-mcp-<triple>[.exe]
      # for bundle.externalBin. It needs only the Rust toolchain installed above.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Music Tag Cleaner ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
