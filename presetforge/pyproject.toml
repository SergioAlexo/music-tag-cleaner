[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "presetforge"
version = "0.1.0"
description = "Synth preset conversion engine for Music Tag Cleaner (JSON-lines CLI)"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    "serum2vital[serum2] @ git+https://github.com/btesser/serum2vital@b67d9d3",
]

[project.optional-dependencies]
verify = ["vita", "numpy"]
dev = ["pytest", "vita", "numpy"]

[project.scripts]
presetforge = "presetforge.cli:main"

[tool.setuptools]
packages = ["presetforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
