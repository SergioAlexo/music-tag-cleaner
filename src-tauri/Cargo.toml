[package]
name = "music-tag-cleaner"
version = "0.18.0"
description = "Clean up messy audio tags, with a local AI or by hand"
license = "GPL-3.0-or-later"
repository = "https://github.com/sergioalexo/music-tag-cleaner"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
# Held at 0.22 on purpose: 0.24 removed `ItemKey::Unknown`, which is how the
# generic `Tag` API carries the private TXXX:TRACKID frame, the TAGBACKUP
# restore snapshot and every raw "All Tags" field. Moving past it means
# porting the tag layer to each format's own API (see ROADMAP backlog).
lofty = "0.22"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls on the `ring` provider — the same TLS stack tauri-plugin-updater
# already compiles in, so the HTTP client adds no second crypto backend (the
# reqwest default, aws-lc-rs, is a large C build).
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "http2", "charset", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
walkdir = "2"
tokio = { version = "1", features = ["time"] }
trash = "5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
rusty-chromaprint = "0.3.0"
symphonia = { version = "0.6.1", features = ["mp3", "flac", "aac", "isomp4", "wav", "ogg", "vorbis", "aiff"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
blake3 = "1.8.7"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
quick-xml = "0.42.0"
fatfs = "0.3.6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# D1 AI-control bridge: loopback-only HTTP (tiny_http has no async runtime or TLS) and an OS RNG for the bearer token.
tiny_http = "0.12"
getrandom = "0.3"
whatlang = "0.18.0"

# Windows-only: raw volume access for the FAT32 formatter. Pinned to the same
# major as the copy Tauri already pulls in, so the tree carries one `windows`.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Storage_EnhancedStorage",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
