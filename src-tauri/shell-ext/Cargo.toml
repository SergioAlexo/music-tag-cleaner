[package]
name = "music-tag-cleaner-shell"
version = "0.19.1"
description = "Windows 11 Explorer context-menu entry (IExplorerCommand) for MusicTagCleaner"
license = "GPL-3.0-or-later"
edition = "2021"
publish = false

# Standalone crate: built as its own DLL and loaded by Explorer's COM
# surrogate, never linked into the app.
[workspace]

[lib]
name = "music_tag_cleaner_shell"
crate-type = ["cdylib"]

[dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
